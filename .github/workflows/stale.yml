# Security note: No untrusted input is used in run commands.

name: Stale Check

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale Issues and PRs
    runs-on: linux-amd64-cpu4
    steps:
      - uses: dsx-ai-factory/dsx-github-actions/.github/actions/stale-check@e8c0885851e9314211f2b3439e827990a46ea593
