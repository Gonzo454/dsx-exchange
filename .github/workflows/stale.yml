# Security note: No untrusted input is used in run commands.

name: Stale Check

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale Issues and PRs
    runs-on: linux-amd64-cpu4
    steps:
      - uses: dsx-ai-factory/dsx-github-actions/.github/actions/stale-check@f515eb0f51c611abaa382cc6a09a042efa35d4c1
